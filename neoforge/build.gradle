import net.neoforged.moddevgradle.dsl.RunModel

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    // To change the version see the gradle.properties file
    version = neoforge_version

    runs {
        // Each run is passed in as "run" so IntelliJ knows its type and doesn't warn
        // ("Cannot assign 'String' to 'T'" with ideName = ...)
        client { RunModel run ->
            run.client()
            run.ideName.set('NeoForge Client')
        }
        server { RunModel run ->
            run.server()
            run.ideName.set('NeoForge Server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// IntelliJ starts the NeoForge runs with launch files that the prepare tasks write to build/moddev.
// Running the prepare task before each launch keeps the runs working after a clean or rebuild.
neoForge.runs.configureEach { run ->
    run.taskBefore(tasks.named("prepare${run.name.capitalize()}Run"))
}

// Marks this project as "neoforge" so Loom and ModDevGradle pick the right variants
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
